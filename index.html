var SC=[[98,"10"],[94,"9"],[89,"8"],[78,"7"],[67,"6"],[56,"5"],[45,"4"],[0,"ниже 4 (1–3)"]];
// 5 фиксированных вариантов: вопросы раздела делятся по порядку на 5 непересекающихся частей
function chunk(a,n){var r=[],b=Math.floor(a.length/n),m=a.length%n,p=0;for(var i=0;i<n;i++){var l=b+(i<m?1:0);r.push(a.slice(p,p+l));p+=l}return r}
var V={blood:chunk(D.blood.q,5),heart:chunk(D.heart.q,5),vessels:chunk(D.vessels.q,5)};
V.all=[0,1,2,3,4].map(function(i){return[].concat(V.blood[i],V.heart[i],V.vessels[i])});
function grade(p){for(var i=0;i<SC.length;i++)if(p>=SC[i][0])return i}
var app=document.getElementById("app"),S;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
// Модальные окна вместо alert/confirm: в Telegram и мобильных webview они могут не показываться
function showDlg(msg,btns){
 var w=document.createElement("div");w.className="ovl";
 var b="";btns.forEach(function(x,i){b+='<button class="btn'+(x.g?" g":"")+'" data-i="'+i+'">'+esc(x.t)+'</button>'});
 w.innerHTML='<div class="box"><div class="qt">'+esc(msg)+'</div><div class="row">'+b+'</div></div>';
 function close(){if(w.parentNode)w.parentNode.removeChild(w);document.removeEventListener("keydown",key)}
 function key(e){if(e.key==="Escape"||e.keyCode===27)close()}
 document.addEventListener("keydown",key);
 w.querySelectorAll("button").forEach(function(el){el.onclick=function(){var x=btns[+el.dataset.i];close();if(x.f)x.f()}});
 document.body.appendChild(w);
 var f=w.querySelector("button");if(f)f.focus()}
function askOk(msg,ok){showDlg(msg,[{t:"Отмена",g:1},{t:"OK",f:ok}])}
function tell(msg){showDlg(msg,[{t:"Понятно"}])}
var RN=45;
function pick(a,n){return sh(a).slice(0,n)}
function rndSet(k){var N=RN;if(k!=="all")return pick(D[k].q,Math.min(N,D[k].q.length));var b=Math.floor(N/3),e=N%3,r=[];["blood","heart","vessels"].forEach(function(s,i){r=r.concat(pick(D[s].q,b+(i<e?1:0)))});return r}
function qs(k,v){if(k==="mist")return mistQ();return v==="rnd"?rndSet(k):v==="full"?D[k].q:V[k][v]}
function lbl(k,v){if(k==="mist")return "Неправильные варианты для проработки тщательнее";return D[k].t+(v==="rnd"?" · случайный вариант":v==="full"?" · весь раздел":" · вариант "+(v+1))}
// ---- Проработка ошибок: автоматический сбор вопросов с неверными ответами ----
var MK="fiz_mistakes_v1",memM=[];
function loadM(){try{var a=JSON.parse(localStorage.getItem(MK));if(Array.isArray(a))return a}catch(e){}return memM}
function storageOK(){try{localStorage.setItem("__fiz_t","1");localStorage.removeItem("__fiz_t");return true}catch(e){return false}}
function saveM(a){memM=a;try{localStorage.setItem(MK,JSON.stringify(a))}catch(e){}}
function mkey(q){return q[0]+"||"+q[1].join("||")}
function addM(q,k){var a=loadM(),key=mkey(q),ex=null;a.forEach(function(x){if(x.key===key)ex=x});if(ex){ex.w=(ex.w||1)+1}else{a.push({key:key,k:k,q:q[0],o:q[1],a:q[2],n:q[3]||"",w:1})}saveM(a)}
function delM(keys){saveM(loadM().filter(function(x){return keys.indexOf(x.key)<0}))}
function mistQ(){return loadM().map(function(x){return[x.q,x.o,x.a,x.n||""]})}
function mistCard(){
 var a=loadM();
 var h='<div class="card" style="border-color:var(--ac)"><b>Неправильные варианты для проработки тщательнее</b> <span class="k">('+a.length+' вопр.)</span><div class="k" style="margin-top:6px">Сюда автоматически попадают вопросы, в которых вы ошиблись в любом тесте. Вопросы, пройденные здесь правильно, удаляются из списка — так он постепенно очищается.</div>'+(!storageOK()?'<div class="k" style="margin-top:6px;color:var(--no)">⚠ В этом браузере сохранение недоступно: список не сохранится после закрытия страницы.</div>':'')+'<div class="vr">';
 if(a.length)h+='<button class="chip" style="border-color:var(--ac)" id="mistStart">▶ Начать проработку</button><button class="chip" id="mistClear">Очистить список</button>';
 else h+='<button class="chip" disabled style="opacity:.6">Список пуст</button>';
 return h+'</div></div>'}
function vp(n){var a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return"вопросов";if(b>1&&b<5)return"вопроса";if(b===1)return"вопрос";return"вопросов"}
function menu(){
 var h='<h1>Физиология: кровь, сердце, сосуды</h1><p class="s">В каждом разделе 5 фиксированных вариантов с разными вопросами и случайные варианты, которые каждый раз собираются заново.</p>';
 h+=mistCard();
 h+='<div class="card"><b>Случайный вариант</b> <span class="k">— вопросов в нём:</span> <select id="rn" class="sr" style="width:auto;display:inline-block;margin:0 0 0 6px"><option>40</option><option selected>45</option><option>50</option></select><div class="k" style="margin-top:6px">В общем тесте вопросы берутся поровну из крови, сердца и сосудов. Кнопка «Случайный вариант» в любом разделе каждый раз даёт новый набор.</div></div>';
 ["blood","heart","vessels","all"].forEach(function(k){
  h+='<div class="card"><b>'+D[k].t+'</b> <span class="k">('+D[k].q.length+' '+vp(D[k].q.length)+')</span><div class="vr">';
  for(var i=0;i<5;i++)h+='<button class="chip" data-k="'+k+'" data-v="'+i+'">Вариант '+(i+1)+'<small>'+V[k][i].length+' вопр.</small></button>';
  h+='</div><div class="vr"><button class="chip" data-k="'+k+'" data-v="rnd">🎲 Случайный вариант</button><button class="chip" data-k="'+k+'" data-v="full">Весь раздел</button><button class="chip" data-k="'+k+'" data-v="th">Теория с ответами</button></div></div>'});
 app.innerHTML=h+scaleCard(-1);
 var ms=document.getElementById("mistStart");if(ms)ms.onclick=function(){start("mist","full")};
 var mc=document.getElementById("mistClear");if(mc)mc.onclick=function(){askOk("Очистить список неправильных вариантов?",function(){saveM([]);menu()})};
 app.querySelectorAll(".chip[data-k]").forEach(function(b){b.onclick=function(){var v=b.dataset.v;if(v==="th")theory(b.dataset.k);else{RN=+document.getElementById("rn").value;start(b.dataset.k,(v==="full"||v==="rnd")?v:+v)}}})}
function scaleCard(me){
 var r="";for(var i=SC.length-1;i>=0;i--){var hi=i?SC[i-1][0]-1:100;r+='<tr'+(i==me?' class="me"':'')+'><td>'+(i==SC.length-1?"0":SC[i][0])+'–'+hi+' %</td><td>'+SC[i][1]+'</td></tr>'}
 return '<div class="card tw"><b>Шкала перевода</b><table><tr><th>Процент верных</th><th>Отметка</th></tr>'+r+'</table></div>'}
function theory(k){
 var h='<div class="row"><button class="btn g" id="mn">Меню</button></div><h1>Теория: '+D[k].t+'</h1><p class="s">Все вопросы раздела: слева вопрос, справа верный ответ.</p><input id="sr" class="sr" placeholder="Поиск по вопросам и ответам"><div class="k" id="cnt"></div><div class="tw"><table class="th"><tr><th>№</th><th>Вопрос</th><th>Верный ответ</th></tr>';
 D[k].q.forEach(function(q,i){var a=q[1][q[2]];h+='<tr data-t="'+esc((q[0]+' '+a).toLowerCase())+'"><td>'+(i+1)+'</td><td>'+esc(q[0])+'</td><td class="okc">'+esc(a)+(q[3]?'<div class="k" style="font-weight:400">⚠ '+esc(q[3])+'</div>':'')+'</td></tr>'});
 app.innerHTML=h+'</table></div>';
 var rows=app.querySelectorAll("tr[data-t]"),cnt=document.getElementById("cnt");
 function f(){var t=document.getElementById("sr").value.toLowerCase().trim(),n=0;rows.forEach(function(r){var ok=!t||r.dataset.t.indexOf(t)>=0;r.style.display=ok?"":"none";if(ok)n++});cnt.textContent="Показано: "+n+" из "+rows.length}
 document.getElementById("sr").oninput=f;f();document.getElementById("mn").onclick=menu;scrollTo(0,0)}
function start(k,v){
 if(k==="mist"&&!loadM().length){tell("Список пуст. Сначала пройдите любой тест — вопросы с неверными ответами появятся здесь автоматически.");return}
 S={k:k,v:v,i:0,items:sh(qs(k,v)).map(function(q){return{q:q[0],s:q,note:q[3]||"",o:sh(q[1].map(function(t,i){return{t:t,c:i==q[2]}})),a:-1}})};draw()}
function draw(){
 var it=S.items[S.i],n=S.items.length,done=S.items.filter(function(x){return x.a>=0}).length;
 var h='<div class="k">'+lbl(S.k,S.v)+' · вопрос '+(S.i+1)+' из '+n+' · отвечено '+done+'</div><div class="bar"><i style="width:'+(S.i+1)/n*100+'%"></i></div><div class="card"><div class="q">'+esc(it.q)+'</div>';
 it.o.forEach(function(o,j){h+='<button class="o'+(it.a==j?' sel':'')+'" data-j="'+j+'">'+esc(o.t)+'</button>'});
 h+='</div><div class="row">'+(S.i?'<button class="btn g" id="pv">Назад</button>':'')+(S.i<n-1?'<button class="btn" id="nx">Далее</button>':'')+'<button class="btn g" id="fn">Завершить</button><button class="btn g" id="mn">Меню</button></div>';
 app.innerHTML=h;
 app.querySelectorAll(".o").forEach(function(b){b.onclick=function(){it.a=+b.dataset.j;draw()}});
 var e;if(e=document.getElementById("pv"))e.onclick=function(){S.i--;draw()};
 if(e=document.getElementById("nx"))e.onclick=function(){S.i++;draw()};
 document.getElementById("mn").onclick=menu;
 document.getElementById("fn").onclick=function(){var un=n-done;if(!un)finish();else askOk("Не отвечено вопросов: "+un+". Завершить?",finish)}}
function finish(){
 var added=0;
 if(S.k==="mist"){
  var done=S.items.filter(function(x){return x.a>=0&&x.o[x.a].c}).map(function(x){return mkey(x.s)});
  if(done.length)delM(done);
 }else{
  S.items.forEach(function(it){if(it.a>=0&&!it.o[it.a].c){addM(it.s,S.k);added++}});
 }
 var M=loadM();
 var n=S.items.length,ok=S.items.filter(function(x){return x.a>=0&&x.o[x.a].c}).length,p=ok/n*100,g=grade(p);
 var msg=S.k==="mist"?(M.length?'<div class="k">Осталось в списке проработки: '+M.length+'</div>':'<div class="k">Список проработки пуст — все ошибки разобраны.</div>'):(added?'<div class="k">Добавлено в «Неправильные варианты для проработки тщательнее»: '+added+'</div>':'');
 var h='<div class="card res"><div class="k">'+lbl(S.k,S.v)+'</div><div class="pct">'+Math.round(p*10)/10+' %</div><div>Верно: '+ok+' из '+n+'</div><div class="gr">Отметка: <b>'+SC[g][1]+'</b></div>'+msg+'<div class="row" style="justify-content:center">'+(S.k==="mist"&&!M.length?'':'<button class="btn" id="re">Пройти заново</button>')+(S.k!=="mist"&&M.length?'<button class="btn g" id="mst">Проработать ошибки ('+M.length+')</button>':'')+'<button class="btn g" id="mn">Меню</button></div></div>'+scaleCard(g)+'<h1>Разбор</h1>';
 S.items.forEach(function(it,i){
  h+='<div class="card"><div class="q">'+(i+1)+'. '+esc(it.q)+'</div>';
  it.o.forEach(function(o,j){var c=o.c?' ok':(it.a==j?' bad':'');h+='<div class="o'+c+'">'+(it.a==j?'▸ ':'')+esc(o.t)+(o.c?' ✓':'')+'</div>'});
  h+=(it.a<0?'<div class="k">Нет ответа</div>':'')+(it.note?'<div class="k">⚠ '+esc(it.note)+'</div>':'')+'</div>'});
 app.innerHTML=h;scrollTo(0,0);
 var e;if(e=document.getElementById("re"))e.onclick=function(){start(S.k,S.v)};

menu();
